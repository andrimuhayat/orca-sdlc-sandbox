name: qa-e2e
on: pull_request
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cp .env.example .env
      - run: docker compose up -d --wait
      - run: npm ci && npm run test:e2e
      - if: always()
        run: docker compose down -v
